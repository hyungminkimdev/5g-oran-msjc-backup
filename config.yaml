# MSJC Project - Common Configuration (TEMPLATE)
# MSJC: Multi-Stage Jamming Classification for 5G O-RAN (CCI xG Testbed)
#
# 사용법: cp config.template.yaml config.yaml
#         config.yaml 에서 토큰 등 인스턴스별 값 입력
#         config.yaml 은 .gitignore 처리됨 — git에 커밋하지 말 것

# ─────────────────────────────────────────────
# Network / Infrastructure
# ─────────────────────────────────────────────
network:
  # gateway: 미사용 — ZeroTier 직접 연결로 전환 (ProxyJump 없음)
  # 물리적 순서: Classifier → Jammer → UE
  nodes:
    instance2_classifier:
      ip: "10.111.143.143"       # ZeroTier network: d5cc70b949
      role: "Classifier/RIC"
      usrp:
        ip: "192.168.116.2"
        serial: "323DF42"
        interface: "ens5"
        mtu: 9000

    instance3_jammer:
      ip: "10.111.143.61"        # ZeroTier network: e51276b157
      role: "Jammer"
      usrp:
        ip: "192.168.115.2"
        serial: "323EE55"
        interface: "ens5"
        mtu: 9000

    instance1_ue:
      ip: "10.111.143.165"       # ZeroTier network: b92226be69
      role: "UE"
      usrp:
        ip: "192.168.114.2"
        serial: "323DF47"
        interface: "ens5"
        mtu: 9000

# ─────────────────────────────────────────────
# MSJC Pipeline
# ─────────────────────────────────────────────
pipeline:
  stage1_mlp:
    task: "binary_anomaly_detection"
    max_latency_ms: 5

  stage2_ksvm:
    task: "physical_jamming_classification"
    max_latency_ms: 20

  stage3_mobilenetv3:
    task: "semantic_spectrogram_analysis"
    input_size: [224, 224]
    max_latency_ms: 100

  oran_ric:
    timing: "near_rt"
    latency_range_ms: [10, 1000]

# ─────────────────────────────────────────────
# SDR / UHD
# ─────────────────────────────────────────────
sdr:
  driver: "uhd"
  stream_interface: "ens5"
  mtu: 9000
  snapshot_on_stage3: false    # USRP는 srsRAN gNB가 점유 중 — IQ 캡처 비활성화

# ─────────────────────────────────────────────
# Data & MLOps
# ─────────────────────────────────────────────
data:
  influxdb:
    enabled: true
    url: "http://localhost:8086"
    token: "DHC1g0lVyoUHh_Qs5bYexl6BL7IeNHNjJ77Uu4xBPHAMFEUjpofw7QlN8W0S9v66JRd4f4OMS64SEYR9nq_BNA=="
    org: "msjc"
    bucket: "jamming_kpi"
    batch_size: 100
    flush_interval_ms: 5000

  clearml:
    purpose: "Model management and retraining"

# ─────────────────────────────────────────────
# Model Update Policy
# ─────────────────────────────────────────────
model_update:
  strategy: "in_place"   # Switch weights without service interruption
